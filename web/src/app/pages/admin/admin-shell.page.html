<div class="flex min-h-screen bg-slate-50 text-slate-900">
  <aside class="flex w-64 shrink-0 flex-col border-r border-slate-200 bg-white">
    <div class="border-b border-slate-200 px-5 py-5">
      <div class="flex items-center gap-2">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-navy-800 text-white">
          <i class="ph-bold ph-buildings text-base" aria-hidden="true"></i>
        </span>
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-navy-700">GOP</p>
          <p class="text-xs text-slate-500">Admin Plataforma</p>
        </div>
      </div>
    </div>

    <nav class="flex flex-1 flex-col gap-1 p-3">
      <a
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="admin-nav-link"
      >
        <i class="ph ph-chart-pie-slice text-lg" aria-hidden="true"></i>
        Visão geral
      </a>
      <a routerLink="/admin/empresas" routerLinkActive="active" class="admin-nav-link">
        <i class="ph ph-buildings text-lg" aria-hidden="true"></i>
        Empresas clientes
      </a>
    </nav>

    <div class="border-t border-slate-200 p-4">
      @if (usuario(); as user) {
        <div class="flex items-center gap-3">
          <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-navy-50 text-navy-700">
            <i class="ph ph-user text-lg" aria-hidden="true"></i>
          </span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-slate-900">{{ user.nome }}</p>
            <p class="truncate text-xs text-slate-500">{{ user.email }}</p>
          </div>
        </div>
      }
      <button type="button" class="admin-btn-secondary mt-3 w-full" (click)="sair()">
        <i class="ph ph-sign-out text-base" aria-hidden="true"></i>
        Sair
      </button>
    </div>
  </aside>

  <main class="min-w-0 flex-1 overflow-auto bg-slate-50">
    <router-outlet />
  </main>
</div>
