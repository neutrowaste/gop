<div class="flex min-h-screen bg-slate-950 text-slate-100">
  <aside class="flex w-64 shrink-0 flex-col border-r border-slate-800 bg-slate-950/90">
    <div class="border-b border-slate-800 px-5 py-5">
      <p class="text-[11px] font-medium uppercase tracking-[0.28em] text-emerald-400">NeutroWaste</p>
      <h1 class="mt-2 text-lg font-semibold tracking-tight">GOP Admin</h1>
      <p class="mt-1 text-xs text-slate-500">Controle da plataforma</p>
    </div>

    <nav class="flex flex-1 flex-col gap-1 p-3 text-sm">
      <a
        routerLink="/admin"
        routerLinkActive="bg-emerald-500/15 text-emerald-300"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-lg px-3 py-2 text-slate-300 transition hover:bg-slate-900 hover:text-white"
      >
        Visão geral
      </a>
      <a
        routerLink="/admin/empresas"
        routerLinkActive="bg-emerald-500/15 text-emerald-300"
        class="rounded-lg px-3 py-2 text-slate-300 transition hover:bg-slate-900 hover:text-white"
      >
        Empresas clientes
      </a>
    </nav>

    <div class="border-t border-slate-800 p-4">
      @if (usuario(); as user) {
        <p class="truncate text-sm font-medium text-slate-200">{{ user.nome }}</p>
        <p class="truncate text-xs text-slate-500">{{ user.email }}</p>
      }
      <button
        type="button"
        class="mt-3 w-full rounded-lg border border-slate-700 px-3 py-1.5 text-left text-sm text-slate-300 transition hover:border-slate-500 hover:text-white"
        (click)="sair()"
      >
        Sair
      </button>
    </div>
  </aside>

  <main class="min-w-0 flex-1 overflow-auto">
    <router-outlet />
  </main>
</div>
