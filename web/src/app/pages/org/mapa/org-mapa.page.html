<div class="px-6 py-8 lg:px-10">
  <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-2xl font-semibold tracking-tight text-slate-900">Mapa Operacional</h2>
      <p class="mt-1 text-sm text-slate-500">
        Posições dos ativos e status dos trechos das escalas publicadas de hoje.
      </p>
    </div>
    @if (ultimaAtualizacaoEm(); as ultima) {
      <p class="text-xs text-slate-400">
        Atualizado às {{ ultima | date: 'HH:mm:ss' }}
      </p>
    }
  </header>

  @if (erro(); as mensagem) {
    <div class="admin-alert-error mb-4">{{ mensagem }}</div>
  }

  @if (carregando()) {
    <p class="text-sm text-slate-500">Carregando mapa…</p>
  } @else {
    <app-mapa-operacional [dados]="dados()" />
  }
</div>
