<div class="px-6 py-8 lg:px-10">
  <a
    routerLink="/org/setores"
    class="inline-flex items-center gap-1 text-sm font-medium text-slate-500 transition hover:text-navy-800"
  >
    <i class="ph ph-arrow-left" aria-hidden="true"></i>
    Setores
  </a>

  @if (carregando()) {
    <p class="mt-6 text-sm text-slate-500">Carregando setor…</p>
  } @else if (setor(); as item) {
    <header class="mt-4 mb-6 flex flex-wrap items-start justify-between gap-4">
      <div>
        <p class="text-xs font-medium uppercase tracking-[0.16em] text-navy-600">Setor</p>
        <h2 class="mt-1 text-2xl font-semibold tracking-tight text-slate-900">{{ item.nome }}</h2>
        <p class="mt-1 text-sm text-slate-500">{{ item.cidadeNome }}</p>
      </div>
      @if (item.ativo) {
        <span class="admin-badge-ok">Ativo</span>
      } @else {
        <span class="admin-badge-off">Inativo</span>
      }
    </header>

    @if (erro(); as mensagem) {
      <div class="admin-alert-error mb-4">{{ mensagem }}</div>
    }
    @if (ok(); as mensagem) {
      <div class="admin-alert-ok mb-4">{{ mensagem }}</div>
    }

    <form class="admin-card max-w-xl space-y-4 p-5" [formGroup]="form" (ngSubmit)="salvar()">
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700" for="cidadeId">Cidade</label>
        <select id="cidadeId" formControlName="cidadeId" class="admin-input">
          @for (cidade of cidades(); track cidade.id) {
            <option [ngValue]="cidade.id">{{ cidade.nome }} ({{ cidade.uf }})</option>
          }
        </select>
      </div>
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700" for="codigo">Código</label>
        <input id="codigo" formControlName="codigo" class="admin-input" />
      </div>
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-700" for="nome">Nome</label>
        <input id="nome" formControlName="nome" class="admin-input" />
      </div>
      <label class="flex items-center gap-2 text-sm text-slate-700">
        <input type="checkbox" formControlName="ativo" class="rounded border-slate-300 text-navy-800" />
        Setor ativo
      </label>
      <div class="flex flex-wrap gap-2 pt-2">
        <button type="submit" class="admin-btn-primary" [disabled]="salvando()">
          <i class="ph ph-floppy-disk" aria-hidden="true"></i>
          Salvar
        </button>
        @if (item.ativo) {
          <button type="button" class="admin-btn-danger" (click)="desativar()">
            <i class="ph ph-prohibit" aria-hidden="true"></i>
            Desativar
          </button>
        }
      </div>
    </form>
  }
</div>
