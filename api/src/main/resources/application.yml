spring:
  application:
    name: gop-api
  # Para IDE/execução sem Maven: use --spring.profiles.active=postgres
  # (spring-boot:run já ativa postgres via pom.xml).
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080
  servlet:
    context-path: /api

security:
  jwt:
    issuer: gop
    # Sessão operacional (admin empresa incluso): mínimo 6h; padrão 12h.
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:12h}
    # Apenas para desenvolvimento local. Em produção, JWT_SECRET é obrigatório.
    secret: ${JWT_SECRET:gop-local-dev-secret-change-me-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    br.com.gop: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

gop:
  cors:
    origins: ${GOP_CORS_ORIGINS:http://localhost:4200}
    origin-patterns: ${GOP_CORS_ORIGIN_PATTERNS:}
  rassystem:
    base-url: ${RASSYSTEM_BASE_URL:https://backend.rassystem.com.br/app/v1/api}
    login: tsilva2
    senha: cra20262
    id-filial: ${RASSYSTEM_ID_FILIAL:}
    id-rotulo: ${RASSYSTEM_ID_ROTULO:}
    id-tipo-servico: ${RASSYSTEM_ID_TIPO_SERVICO:}
    empresa-id: ${RASSYSTEM_EMPRESA_ID:}
    poller-enabled: ${RASSYSTEM_POLLER_ENABLED:false}
    poll-interval-ms: ${RASSYSTEM_POLL_INTERVAL_MS:120000}


---
# Sem profile postgres: sobe só a API (health) sem exigir PostgreSQL.
spring:
  config:
    activate:
      on-profile: "!postgres"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
