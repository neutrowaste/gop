spring:
  application:
    name: gop-api
  # Para IDE/execução sem Maven: use --spring.profiles.active=postgres
  # (spring-boot:run já ativa postgres via pom.xml).

server:
  port: 8080
  servlet:
    context-path: /api

security:
  jwt:
    issuer: gop
    # Dev local: sessão mais longa para operar o admin sem reautenticar a cada 15 min.
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:8h}
    # Apenas para desenvolvimento local. Em produção, JWT_SECRET é obrigatório.
    secret: ${JWT_SECRET:gop-local-dev-secret-change-me-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    br.com.gop: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

---
# Sem profile postgres: sobe só a API (health) sem exigir PostgreSQL.
spring:
  config:
    activate:
      on-profile: "!postgres"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
