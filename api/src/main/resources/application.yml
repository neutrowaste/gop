spring:
  application:
    name: gop-api

server:
  port: 8080
  servlet:
    context-path: /api

security:
  jwt:
    issuer: neutrowaste-gop
    access-token-ttl: 15m
    # Apenas para desenvolvimento local. Em produção, JWT_SECRET é obrigatório.
    secret: ${JWT_SECRET:gop-local-dev-secret-change-me-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    br.com.neutrowaste.gop: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

---
# Sem profile postgres: sobe só a API (health) sem exigir PostgreSQL.
spring:
  config:
    activate:
      on-profile: "!postgres"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
