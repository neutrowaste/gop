spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gop
    username: gop
    password: gop
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgis.sql

gop:
  seed:
    admin-plataforma:
      enabled: ${GOP_SEED_ADMIN_ENABLED:true}
      email: ${GOP_SEED_ADMIN_EMAIL:admin@neutrowaste.com}
      # Apenas para desenvolvimento local. 
      senha: ${GOP_SEED_ADMIN_SENHA:Admin@Gop2026}
      nome: ${GOP_SEED_ADMIN_NOME:Admin Plataforma NeutroWaste}
