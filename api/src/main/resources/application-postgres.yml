spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gop}
    username: ${SPRING_DATASOURCE_USERNAME:gop}
    password: ${SPRING_DATASOURCE_PASSWORD:gop}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    # false: schema-postgis.sql roda ANTES do Hibernate criar colunas geometry
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      # Sem PostGIS instalado no servidor, CREATE EXTENSION falha; não derruba o boot.
      # Após instalar PostGIS (Stack Builder) e reiniciar o PG, reinicie a API.
      continue-on-error: true
      # schema-postgis.sql usa ";;" para não partir o bloco DO $$ no meio.
      separator: ";;"
      schema-locations: classpath:schema-postgis.sql

gop:
  seed:
    admin-plataforma:
      enabled: ${GOP_SEED_ADMIN_ENABLED:true}
      email: ${GOP_SEED_ADMIN_EMAIL:admin@gop.com}
      # Apenas para desenvolvimento local. 
      senha: ${GOP_SEED_ADMIN_SENHA:Admin@Gop2026}
      nome: ${GOP_SEED_ADMIN_NOME:Admin Plataforma GOP}
